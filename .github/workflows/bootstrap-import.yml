name: Importar código preparado

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Publicar versão 0.5.0
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extrair árvore do projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir .bootstrap
          unzip -q nfce-thermal-printer-matheus-v0.5.0.zip -d .bootstrap
          cp -a .bootstrap/nfce-thermal-printer/. .
          rm -rf .bootstrap
          rm -f nfce-thermal-printer-matheus-v0.5.0.zip
          rm -f .github/workflows/bootstrap-import.yml

      - name: Criar commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar NFC-e Thermal Printer 0.5.0"
          git push
