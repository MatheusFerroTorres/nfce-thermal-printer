# false gera apenas o preview; true envia ao driver depois da conversao e validacao.
spool.directory=C:\\Spool
printer.name=ELGIN i9(USB)
# Bobina fisica de 80 mm; pagina logica de 72 mm validada no driver ELGIN 1.7.3.
paper.width.mm=72
printable.width.mm=72
margin.mm=2
dpi=203
analysis.dpi=203
raster.white.threshold=250
bounds.tolerance.mm=1
font.minimum.size.pt=6.5
line.spacing.factor=1.25
row.gap.mm=0.4
section.gap.mm=1.5
# 37.537 mm correspondem a aproximadamente 300 pontos a 203 dpi.
qr.size.mm=37.537
qr.quiet.zone.mm=2
# enhanced organiza blocos e divisorias; classic mantem o primeiro preview.
layout.style=enhanced
# Logo monocromatica incorporada ao JAR.
logo.enabled=true
logo.resource=/assets/alkhemylab-logo-thermal.png
logo.width.mm=50
logo.spacing.mm=2
output.suffix=_termico
log.directory=logs
auto.print=false
# 203 rasteriza na resolucao nativa da ELGIN i9; 0 usa impressao vetorial.
print.raster.dpi=203
print.copies=1
# Fase 3: monitor de pasta. O glob diferencia apenas o formato do nome, nao maiusculas/minusculas.
watch.file.glob=impressão nfc-e_*.pdf
watch.initial.scan=true
# true permite que uma NFC-e concluida seja solicitada novamente quantas vezes forem necessarias.
watch.allow.completed.reprint=true
# O arquivo precisa permanecer com tamanho e data inalterados por 3 verificacoes de 1 segundo.
watch.stability.interval.ms=1000
watch.stability.required.checks=3
watch.stability.timeout.seconds=60
watch.original.directory=Original
watch.preview.directory=Preview
watch.processed.directory=Processado
watch.printed.directory=Impresso
watch.error.directory=Erro
watch.duplicate.directory=Duplicado
# Estado interno persistente, sempre relativo a spool.directory.
watch.journal.file=.nfce-printer/processing-journal.tsv
watch.initialized.file=.nfce-printer/initialized
watch.lock.file=.nfce-printer/watcher.lock
